name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: integration
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: integration-${{ github.ref }}
      cancel-in-progress: false
    env:
      COOKIDOO_EMAIL: ${{ secrets.COOKIDOO_EMAIL }}
      COOKIDOO_PASSWORD: ${{ secrets.COOKIDOO_PASSWORD }}
      COOKIDOO_COUNTRY: ${{ secrets.COOKIDOO_COUNTRY || 'pl' }}
      COOKIDOO_LANGUAGE: ${{ secrets.COOKIDOO_LANGUAGE || 'pl' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check integration creds
        id: creds
        run: |
          if [ -z "$COOKIDOO_EMAIL" ] || [ -z "$COOKIDOO_PASSWORD" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COOKIDOO_EMAIL/PASSWORD secrets not set — skipping integration"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.creds.outputs.has_creds == 'true'
        run: npm ci
      - if: steps.creds.outputs.has_creds == 'true'
        run: npm run test:integration

  publish:
    name: publish
    needs: unit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
